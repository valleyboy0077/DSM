name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run complete Python test suite
        run: python -m pytest -q
      - name: Build Docker deployment artifact
        run: docker build --file Dockerfile --tag dell-server-manager:ci .
      - name: Generate disposable Compose environment
        run: |
          echo "DSM_ENCRYPTION_KEY=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "DSM_BOOTSTRAP_ADMIN_PASSWORD=smoke-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=dsm-smoke-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Start disposable Compose deployment
        run: docker compose up --build --detach
      - name: Wait for disposable deployment health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs dsm
          exit 1
      - name: Tear down disposable Compose deployment
        if: always()
        run: docker compose down --volumes --remove-orphans
