services:
  dsm:
    build:
      context: .
    image: dell-server-manager:local
    ports:
      - "8080:8080"
      - "8101:8101"
    environment:
      DSM_DB_PATH: /var/lib/dsm/dsm.db
      DSM_ENCRYPTION_KEY: ${DSM_ENCRYPTION_KEY:?DSM_ENCRYPTION_KEY must be set in .env}
      DSM_HOST: 0.0.0.0
      DSM_PORT: "8080"
      DSM_DEBUG: "false"
      DSM_MCP_ENABLED: "true"
      DSM_MCP_PORT: "8101"
    volumes:
      - dsm_data:/var/lib/dsm
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  dsm_data:
